services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev

    volumes:
      - .:/workspaces/geeknote:cached
      # Cache gems installed by bin/setup across container recreations.
      - bundle:/usr/local/bundle

    # bin/setup installs dependencies and prepares the databases before bin/dev starts.
    command: ["bash", "-c", "bin/setup && exec bin/dev"]

    # Keep stdin open so bin/dev's watchers stay alive when run detached.
    tty: true
    stdin_open: true

    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432
      MEILISEARCH_URL: http://meilisearch:7700

    ports:
      - "3000:3000"

    depends_on:
      - postgres
      - meilisearch

  postgres:
    image: postgres:17
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres

  meilisearch:
    image: getmeili/meilisearch:v1.8
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: true
    volumes:
      - meili-data:/meili_data

volumes:
  postgres-data:
  meili-data:
  bundle:
